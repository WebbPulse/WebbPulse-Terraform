name: Runner CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "runner/**"
      - ".github/workflows/runner-ci.yml"

permissions:
  contents: read

concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: Runner
    permissions:
      contents: read
      id-token: write
    uses: WebbPulse/.github/.github/workflows/python-ci.yml@v3
    with:
      python-version: "3.13"
      working-directory: runner
      install-command: >-
        uv lock --check &&
        uv sync --locked
      ruff-target: "app tests"
      typecheck-command: mypy app tests
      coverage-source: app
      pytest-args: ""

  image:
    name: Image build for linux/arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the runner image without pushing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: runner
          file: runner/Dockerfile
          platforms: linux/arm64
          push: false
          load: false
          provenance: false
          cache-from: type=gha,scope=runner-arm64
          cache-to: type=gha,scope=runner-arm64,mode=max

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [runner, image]
    if: always()
    steps:
      - name: Fail unless every upstream job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::at least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "Every upstream job succeeded or was skipped."
