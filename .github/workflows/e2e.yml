name: End-to-end

on:
  workflow_run:
    workflows: ["Deploy Backend", "Deploy Frontend", "Deploy Runner"]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  staging:
    name: Suite (staging)
    if: (github.event.workflow_run.head_branch || github.ref_name) != 'main'
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: write
    uses: WebbPulse/.github/.github/workflows/e2e.yml@v3
    with:
      deploy-workflows: "Deploy Backend, Deploy Frontend, Deploy Runner"
      working-directory: backend
      install-command: uv lock --upgrade-package webbpulse && uv sync --locked --group e2e
      pytest-args: "--no-cov -n auto --dist loadgroup"
      codeartifact-domain: webbpulse
    secrets:
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

  production:
    name: Suite (production)
    if: (github.event.workflow_run.head_branch || github.ref_name) == 'main'
    permissions:
      contents: read
      actions: read
      id-token: write
      checks: write
    uses: WebbPulse/.github/.github/workflows/e2e.yml@v3
    with:
      deploy-workflows: "Deploy Backend, Deploy Frontend, Deploy Runner"
      working-directory: backend
      install-command: uv lock --upgrade-package webbpulse && uv sync --locked --group e2e
      pytest-args: "--no-cov"
      codeartifact-domain: webbpulse
    secrets:
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
