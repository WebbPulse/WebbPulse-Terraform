name: Terraform CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.3"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -recursive -check
        working-directory: terraform
        run: terraform fmt -recursive -check -diff

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether a registry token is available
        id: token
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TF_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::secrets.TF_API_TOKEN is not set, so validate is skipped. The module sources live in the private HCP registry and init cannot reach them without it. The HCP workspace plan on this pull request is the real gate."
          fi

      - name: Set up Terraform
        if: steps.token.outputs.available == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init -backend=false
        if: steps.token.outputs.available == 'true'
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: terraform validate
        if: steps.token.outputs.available == 'true'
        working-directory: terraform
        run: terraform validate -no-color

  all-checks-passed:
    name: all-checks-passed
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    if: always()
    steps:
      - name: Assert no required job failed
        env:
          RESULTS: ${{ needs.fmt.result }} ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          for RESULT in $RESULTS; do
            case "$RESULT" in
              success|skipped) ;;
              *) echo "A Terraform CI job reported ${RESULT}." ; exit 1 ;;
            esac
          done
          echo "Terraform CI passed."
