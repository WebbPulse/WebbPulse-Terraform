[project]
name = "webbpulse-terraform-backend"
version = "0"
requires-python = ">=3.13"
dependencies = [
  "webbpulse[fastapi,dynamodb,otel,aws-otel,security,identity,passkeys,github]>=0.56.0",
  "cryptography>=43",
  "fastapi>=0.141.1",
  "boto3>=1.43.90",
  "pydantic[email]>=2.13.5",
  "pydantic-settings>=2.15.0",
  "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
e2e = ["webbpulse[e2e]>=0.44.0"]
dev = [
  "webbpulse[testing]>=0.44.0",
  "moto[dynamodb,s3,secretsmanager,stepfunctions,logs]>=5.2.3",
  "boto3-stubs[dynamodb,logs,s3,secretsmanager,stepfunctions]>=1.40",
  "botocore-stubs>=1.40",
  "pyright>=1.1.408",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "httpx>=0.28.1",
  "ruff>=0.16.6",
  "bandit>=1.9.2",
  "pip-audit>=2.9.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "codeartifact"
url = "https://webbpulse-432410731887.d.codeartifact.us-west-2.amazonaws.com/pypi/python/simple/"
explicit = true

[tool.uv.sources]
webbpulse = { index = "codeartifact" }

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["build", "dist", "htmlcov", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"scripts/create_local_tables.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.bandit]
exclude_dirs = [".venv", "venv", "__pycache__", ".pytest_cache", ".pyright_cache", "tests"]

[tool.webbpulse.ci]
test-root = "tests"
domains-root = "tests/domains"

[tool.webbpulse.reachability]
anchor = "app.domains.workspaces.entrypoint"
loaded-by-name = ["app.common.identity", "app.common.identity.*"]
