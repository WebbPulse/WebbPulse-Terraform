[project]
name = "webbpulse-terraform-cutover"
version = "0"
description = "Cutover tooling that moves HCP Terraform workspaces onto the owned control plane."
requires-python = ">=3.13"
license = "LicenseRef-PolyForm-Strict-1.0.0"
dependencies = [
  "boto3>=1.43.90",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "boto3-stubs[kms,s3]>=1.43.90",
  "pyright>=1.1.408",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["build", "dist", "htmlcov", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["cutover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --disable-warnings"

[tool.webbpulse.ci]
test-root = "tests"
